      - generic [ref=e89]:
        - heading "1. Общие положения и назначение сервиса" [level=4] [ref=e90]
        - paragraph [ref=e91]: Веб-приложение Tajikistan Monitor («Сервис») представляет собой независимый агрегатор открытых официальных данных Республики Таджикистан. Сервис не является коммерческой организацией, не собирает персональные данные граждан для продажи и не передаёт сведения рекламным сетям.
      - generic [ref=e92]:
        - heading "2. Сбор и обработка данных о местоположении" [level=4] [ref=e93]
        - paragraph [ref=e94]: "Сервис может запрашивать или использовать ваше приблизительное местоположение (город или район), исключительно для следующих технических целей: расчёт и отображение локальной температуры воздуха (°C), предоставление точного прогноза погоды и своевременное оповещение о штормовых и чрезвычайных предупреждениях в выбранном регионе. Точные GPS-координаты пользователя не сохраняются в постоянных базах данных и не привязываются к вашей личности."
      - generic [ref=e95]:
        - heading "3. Локальное хранение на устройстве пользователя" [level=4] [ref=e96]
        - paragraph [ref=e97]: Вся служебная информация, необходимая для комфортной работы (выбранная тема оформления интерфейса, язык отображения RU/TJ, фильтры карты и статус принятия настоящего соглашения), сохраняется исключительно локально в памяти вашего браузера с использованием механизма localStorage. Данная информация никогда не отправляется на сторонние аналитические сервера.
      - generic [ref=e98]:
        - heading "4. Техническая информация веб-запросов" [level=4] [ref=e99]
        - paragraph [ref=e100]: При обращении к серверам приложений в автоматическом режиме обрабатываются стандартные системные заголовки (User-Agent, тип браузера, время отправки запроса). Данные параметры используются исключительно для защиты сетевой инфраструктуры от DDoS-атак, оптимизации скорости загрузки контента и балансировки нагрузки.
      - generic [ref=e101]:
        - heading "5. Отсутствие рекламы, трекеров и сторонних SDK" [level=4] [ref=e102]
        - paragraph [ref=e103]: В программном коде платформы полностью отсутствуют сторонние рекламные сети (Google AdSense, Яндекс.Директ и др.), маркетинговые пиксели, трекеры социальных сетей и скрытые скрипты профилирования. Сервис ориентирован на чистоту информации и безопасность каждого пользователя.
      - generic [ref=e104]:
        - heading "6. Отказ от ответственности и достоверность первоисточников" [level=4] [ref=e105]
        - paragraph [ref=e106]: Все новостные сообщения, гидрометеорологические сводки, курсы валют и сообщения о ЧС транслируются в режиме реального времени напрямую из официальных ведомственных источников (НИАТ «Ховар», КЧС РТ, Агентство статистики, НБТ, Агентство по гидрометеорологии). Администрация сервиса обеспечивает техническую целостность доставки информации, но не несёт ответственности за содержание первоисточников.
